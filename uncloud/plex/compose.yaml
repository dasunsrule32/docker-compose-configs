services:
  plex:
    image: plexinc/pms-docker:latest
    network_mode: host
    env_file:
      - .env
    volumes:
      - ${CONFIG_PATH}:/config
      - ${TRANSCODE_PATH}:/transcode
      - ${MEDIA_PATH}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [all]
    x-ports:
      - plex.domain.com:32400/https
